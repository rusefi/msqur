name: Unit Tests

on:
  push:
   branches:
     - prod
  pull_request:
   branches:
     - prod

jobs:
  php-config:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4']
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: simplexml, mbstring, bcmath, pdo_sqlite
        coverage: none
    - name: Check configuration startup and error reporting
      run: php tests/check_config.php
    - name: Check INI parsing
      run: php tests/check_ini.php
    - name: Check tune dialog rendering
      run: php tests/check_view.php
    - name: Check tune CRC and upload regression
      run: php tests/check_tune_crc.php

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4']

    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, xml, xmlwriter, simplexml, mbstring, bcmath, pdo_sqlite, fileinfo
        tools: phpunit:12.5
        coverage: none

    - name: Copy Config
      run: cp ./src/config_rusefi.php.sample ./src/config_rusefi.php

    - name: Run Tests
      run: bash tests/run_tests.sh
